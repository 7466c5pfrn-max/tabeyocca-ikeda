<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="たべよっか">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F3EA">
<title>たべよっか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --paper:#F7F3EA; --card:#FFFFFF; --text:#2B2620; --muted:#7A7064;
  --line:#E6DED0; --accent:#3E7B5B; --on-accent:#FFFFFF;
  --red:#C8473D; --red-bg:#F8E4E1;
  --yellow:#C9940F; --yellow-bg:#FAF0D2;
  --green:#4C8A3F; --green-bg:#E3F0DE;
  --other:#8C8478; --other-bg:#EEEAE3;
  --urgent:#B23A2F; --urgent-bg:#FBE5E2;
  --soon:#9A6A07; --soon-bg:#FBF0D6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1915; --card:#25221D; --text:#EDE7DC; --muted:#A39A8C;
    --line:#38332B; --accent:#7CC39C; --on-accent:#14231A;
    --red:#F08A80; --red-bg:#3A2422;
    --yellow:#E8C15A; --yellow-bg:#3A311A;
    --green:#94CF83; --green-bg:#23331F;
    --other:#B5AC9F; --other-bg:#312D27;
    --urgent:#F49A8F; --urgent-bg:#3D2320;
    --soon:#EBC46A; --soon-bg:#3A311A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1915; --card:#25221D; --text:#EDE7DC; --muted:#A39A8C;
  --line:#38332B; --accent:#7CC39C; --on-accent:#14231A;
  --red:#F08A80; --red-bg:#3A2422;
  --yellow:#E8C15A; --yellow-bg:#3A311A;
  --green:#94CF83; --green-bg:#23331F;
  --other:#B5AC9F; --other-bg:#312D27;
  --urgent:#F49A8F; --urgent-bg:#3D2320;
  --soon:#EBC46A; --soon-bg:#3A311A;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--text);
  font-family:'Zen Kaku Gothic New',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 calc(72px + env(safe-area-inset-bottom,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.error{color:var(--urgent);font-size:14px;min-height:1.4em;margin:8px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);font-size:16px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.wide{width:100%;margin-top:16px}
.btn.danger{color:var(--urgent)}
.row-btns{display:flex;gap:8px;margin-top:16px}
.row-btns .btn{flex:1}

.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;text-align:left}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)}
.dot.green{background:var(--green)} .dot.other{background:var(--other)}
.item-main{flex:1;min-width:0}
.item-name,.item-sub{display:block}
.item-name{font-weight:500;overflow-wrap:anywhere}
.item-sub{font-size:13px;color:var(--muted)}
.badge{flex:none;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--other-bg);color:var(--muted);white-space:nowrap}
.badge.urgent{background:var(--urgent-bg);color:var(--urgent);font-weight:700}
.badge.soon{background:var(--soon-bg);color:var(--soon);font-weight:700}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}

.pick{margin-top:24px;padding:14px 16px;border-radius:14px;border:1px dashed var(--line)}
.pick .item{padding:4px 0}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.seg.colors button[data-v="red"][aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.seg.colors button[data-v="yellow"][aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow)}
.seg.colors button[data-v="green"][aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.seg.colors button[data-v="other"][aria-pressed="true"]{background:var(--other);border-color:var(--other)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .inner{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:10px 4px 12px;border:0;background:none;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.fab{
  position:fixed;z-index:6;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);
  font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.18);
}

dialog{
  width:min(560px,100vw);max-width:100vw;max-height:92vh;margin:auto auto 0;padding:0;border:0;
  border-radius:18px 18px 0 0;background:var(--card);color:var(--text);
}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .sheet{padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
dialog h3{margin:0 0 4px;font-size:18px}
.code{font-size:28px;letter-spacing:.15em;font-weight:700;margin:4px 0}
</style>
</head>
<body>

<main id="view-loading"><p class="muted">読み込み中…</p></main>

<main id="view-login" hidden>
  <h1>たべよっか</h1>
  <form id="login-form" class="card">
    <label for="login-email">メールアドレス</label>
    <input id="login-email" type="email" autocomplete="email" required>
    <label for="login-password">パスワード</label>
    <input id="login-password" type="password" autocomplete="current-password" required>
    <button class="btn primary wide" type="submit">ログイン</button>
    <p class="error" id="login-error"></p>
  </form>
</main>

<main id="view-setup" hidden>
  <h1>家庭の設定</h1>
  <p class="muted small">はじめに片方が家庭を作り、表示される招待コードをもう片方が入力して参加します。</p>
  <form id="create-form" class="card">
    <h3>家庭を作る</h3>
    <label for="create-name">家庭の名前</label>
    <input id="create-name" placeholder="わが家">
    <label for="create-me">あなたの表示名</label>
    <input id="create-me" required>
    <button class="btn primary wide" type="submit">作る</button>
  </form>
  <form id="join-form" class="card" style="margin-top:16px">
    <h3>招待コードで参加する</h3>
    <label for="join-code">招待コード</label>
    <input id="join-code" autocapitalize="characters" required>
    <label for="join-me">あなたの表示名</label>
    <input id="join-me" required>
    <button class="btn wide" type="submit">参加する</button>
  </form>
  <p class="error" id="setup-error"></p>
</main>

<main id="view-home" hidden>
  <h1 id="home-title">たべよっか</h1>
  <h2>早めに使う</h2>
  <ul class="list" id="home-urgent"></ul>
  <div class="pick" id="home-pick" hidden>
    <div class="small muted">ストックから</div>
    <div id="home-pick-body"></div>
  </div>
</main>

<main id="view-fresh" hidden>
  <h1>冷蔵・冷凍</h1>
  <div id="fresh-groups"></div>
</main>

<main id="view-pantry" hidden>
  <h1>ストック</h1>
  <p class="muted small">米・乾物・缶詰など。ときどき眺めて、使えそうなものを探してください。</p>
  <div id="pantry-groups"></div>
</main>

<main id="view-settings" hidden>
  <h1>設定</h1>
  <div class="card">
    <div class="small muted">家庭</div>
    <div id="settings-household" style="font-weight:700"></div>
    <div class="small muted" style="margin-top:12px">招待コード</div>
    <div class="code" id="settings-code"></div>
    <div class="small muted" style="margin-top:12px">メンバー</div>
    <div id="settings-members"></div>
  </div>
  <button class="btn wide" id="logout">ログアウト</button>
</main>

<button class="fab" id="fab" aria-label="食材を追加" hidden>＋</button>

<nav class="tabs" id="tabs" hidden>
  <div class="inner">
    <button data-view="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
    <button data-view="fresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M5 10h14M8 6v2M8 13v3"/></svg>冷蔵・冷凍</button>
    <button data-view="pantry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4zM4 12h16M9 8h6M9 16h6"/></svg>ストック</button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
  </div>
</nav>

<dialog id="add-dialog">
  <form class="sheet" id="add-form" method="dialog">
    <h3>食材を追加</h3>
    <label for="add-name">食材名</label>
    <input id="add-name" list="food-names" autocomplete="off" required>
    <datalist id="food-names"></datalist>
    <label>区分</label>
    <div class="seg" id="add-zone">
      <button type="button" data-v="fresh" aria-pressed="true">冷蔵・冷凍</button>
      <button type="button" data-v="pantry" aria-pressed="false">ストック</button>
    </div>
    <label>保存場所</label>
    <div class="seg" id="add-location"></div>
    <label>三色</label>
    <div class="seg colors" id="add-color">
      <button type="button" data-v="red" aria-pressed="false">赤</button>
      <button type="button" data-v="yellow" aria-pressed="false">黄</button>
      <button type="button" data-v="green" aria-pressed="false">緑</button>
      <button type="button" data-v="other" aria-pressed="true">その他</button>
    </div>
    <label for="add-category">分類</label>
    <input id="add-category" list="category-names" autocomplete="off">
    <datalist id="category-names"></datalist>
    <div class="two">
      <div>
        <label for="add-quantity">量</label>
        <input id="add-quantity" placeholder="1パック">
      </div>
      <div id="add-days-wrap">
        <label for="add-days">使い切り目安（日）</label>
        <input id="add-days" type="number" inputmode="numeric" min="1">
      </div>
    </div>
    <p class="error" id="add-error"></p>
    <div class="row-btns">
      <button class="btn" type="button" id="add-cancel">やめる</button>
      <button class="btn primary" type="submit" id="add-submit">追加</button>
    </div>
  </form>
</dialog>

<dialog id="item-dialog">
  <div class="sheet">
    <h3 id="item-title"></h3>
    <div class="small muted" id="item-meta"></div>
    <div id="item-days-wrap">
      <label for="item-days">使い切り目安日</label>
      <input id="item-days" type="date">
    </div>
    <div class="row-btns">
      <button class="btn primary" id="item-used">使った</button>
      <button class="btn" id="item-discarded">捨てた</button>
    </div>
    <div class="row-btns">
      <button class="btn danger" id="item-delete">記録ごと削除</button>
      <button class="btn" id="item-close">閉じる</button>
    </div>
    <p class="error" id="item-error"></p>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
const SUPABASE_URL = 'https://vlndhxxprxmgzcgpgdyf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kxLizXIyTOVzbFCMk-QtLQ_3FMGzIxp';
const SB = globalThis.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ---------- 定数 ---------- */
const COLOR_LABEL = { red:'赤', yellow:'黄', green:'緑', other:'その他' };
const COLOR_ORDER = ['red', 'yellow', 'green', 'other'];
const LOCATION_LABEL = { fridge:'冷蔵', vegetable:'野菜室', freezer:'冷凍', pantry:'常温' };
const ZONE_LOCATIONS = { fresh:['fridge', 'vegetable', 'freezer'], pantry:['pantry'] };
const FREEZER_DAYS = 30;
// 分類ごとの三色と使い切り目安日数。食材マスタにない新しい食材の初期値に使う。
const CATEGORY_DEFAULTS = {
  fresh: {
    '肉':['red', 3], '魚':['red', 2], '卵':['red', 14], '乳製品':['red', 7],
    '豆腐・大豆製品':['red', 4], 'ハム・ソーセージ':['red', 7],
    'ごはん・パン':['yellow', 3], '麺':['yellow', 3], 'いも':['yellow', 14],
    '葉物野菜':['green', 4], '根菜':['green', 14], 'その他の野菜':['green', 7],
    'きのこ':['green', 5], '果物':['green', 7], '海藻':['green', 7],
    '調味料':['other', 60], '飲み物':['other', 14], 'その他':['other', 7]
  },
  pantry: {
    '米・穀物':['yellow'], '乾麺・パスタ':['yellow'], '粉類':['yellow'],
    '乾物':['green'], '缶詰・瓶詰':['other'], 'レトルト':['other'],
    '調味料':['other'], 'その他':['other']
  }
};

/* ---------- 状態 ---------- */
let user = null;
let household = null;
let members = [];
let items = [];
let foods = [];
let channel = null;
let currentView = 'home';
let openItem = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const showError = (id, error) => { $(id).textContent = error ? (error.message || String(error)) : ''; };

/* ---------- 日付 ---------- */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(dateStr, n){
  const [y, m, d] = dateStr.split('-').map(Number);
  const t = new Date(y, m - 1, d + n);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}
function daysBetween(a, b){
  const [ay, am, ad] = a.split('-').map(Number);
  const [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
const daysLeft = item => item.use_by ? daysBetween(todayStr(), item.use_by) : null;
function agoLabel(dateStr){
  const n = daysBetween(dateStr, todayStr());
  if (n <= 0) return '今日';
  if (n < 30) return `${n}日前`;
  if (n < 365) return `${Math.floor(n / 30)}か月前`;
  return `${Math.floor(n / 365)}年前`;
}
function leftBadge(item){
  const n = daysLeft(item);
  if (n == null) return '';
  if (n < 0) return `<span class="badge urgent">${-n}日過ぎ</span>`;
  if (n === 0) return '<span class="badge urgent">今日まで</span>';
  if (n <= 2) return `<span class="badge soon">あと${n}日</span>`;
  return `<span class="badge">あと${n}日</span>`;
}

/* ---------- 画面 ---------- */
const VIEWS = ['loading', 'login', 'setup', 'home', 'fresh', 'pantry', 'settings'];
function show(view){
  for (const v of VIEWS) $('view-' + v).hidden = v !== view;
  const inApp = ['home', 'fresh', 'pantry', 'settings'].includes(view);
  $('tabs').hidden = !inApp;
  $('fab').hidden = !inApp || view === 'settings';
  if (inApp){
    currentView = view;
    for (const b of document.querySelectorAll('nav.tabs button')){
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    }
    render();
  }
}

function itemRow(item, sub){
  return `<li><button class="item" data-id="${esc(item.id)}">
    <span class="dot ${esc(item.color)}"></span>
    <span class="item-main"><span class="item-name">${esc(item.name)}</span>
      <span class="item-sub">${esc(sub)}</span></span>
    ${item.zone === 'fresh' ? leftBadge(item) : `<span class="badge">${esc(agoLabel(item.added_at))}</span>`}
  </button></li>`;
}
const freshSub = item => [LOCATION_LABEL[item.location], item.quantity, item.category].filter(Boolean).join('・');
const pantrySub = item => [item.quantity, item.category].filter(Boolean).join('・');
const byUseBy = (a, b) => (a.use_by || '9999-12-31').localeCompare(b.use_by || '9999-12-31');
const byAdded = (a, b) => a.added_at.localeCompare(b.added_at);

function render(){
  const active = items.filter(i => i.status === 'active');
  const fresh = active.filter(i => i.zone === 'fresh').sort(byUseBy);
  const pantry = active.filter(i => i.zone === 'pantry').sort(byAdded);

  if (currentView === 'home'){
    $('home-title').textContent = household?.name || 'たべよっか';
    // 冷凍は急かさない。残り3日以内のものを並べる。
    const urgent = fresh.filter(i => i.location !== 'freezer' && daysLeft(i) != null && daysLeft(i) <= 3);
    $('home-urgent').innerHTML = urgent.length
      ? urgent.map(i => itemRow(i, freshSub(i))).join('')
      : '<li class="empty">急ぎのものはありません</li>';
    // ストックから1品。日替わりで、古いものほど出やすくする。
    $('home-pick').hidden = !pantry.length;
    if (pantry.length){
      const seed = daysBetween('2026-01-01', todayStr());
      const pool = pantry.slice(0, Math.max(3, Math.ceil(pantry.length / 2)));
      const pick = pool[seed % pool.length];
      $('home-pick-body').innerHTML = `<ul class="list" style="border:0;background:none">${itemRow(pick, pantrySub(pick))}</ul>`;
    }
  }

  if (currentView === 'fresh'){
    $('fresh-groups').innerHTML = ZONE_LOCATIONS.fresh.map(loc => {
      const list = fresh.filter(i => i.location === loc);
      return `<h2>${LOCATION_LABEL[loc]}（${list.length}）</h2><ul class="list">${
        list.length ? list.map(i => itemRow(i, [i.quantity, i.category].filter(Boolean).join('・'))).join('')
                    : '<li class="empty">なし</li>'}</ul>`;
    }).join('');
  }

  if (currentView === 'pantry'){
    $('pantry-groups').innerHTML = pantry.length ? COLOR_ORDER.map(color => {
      const list = pantry.filter(i => i.color === color);
      if (!list.length) return '';
      return `<h2>${COLOR_LABEL[color]}（${list.length}）</h2><ul class="list">${list.map(i => itemRow(i, pantrySub(i))).join('')}</ul>`;
    }).join('') : '<div class="empty">ストックはまだありません</div>';
  }

  if (currentView === 'settings'){
    $('settings-household').textContent = household?.name || '';
    $('settings-code').textContent = household?.invite_code || '';
    $('settings-members').innerHTML = members.map(m => `<div>${esc(m.display_name || '（名前なし）')}${m.user_id === user.id ? ' <span class="small muted">（あなた）</span>' : ''}</div>`).join('');
  }
}

/* ---------- データ ---------- */
async function loadHousehold(){
  const { data, error } = await SB.from('household_members')
    .select('household_id, households(id, name, invite_code)')
    .eq('user_id', user.id).limit(1).maybeSingle();
  if (error) throw error;
  household = data?.households || null;
}
async function loadAll(){
  const [m, i, f] = await Promise.all([
    SB.from('household_members').select('user_id, display_name').eq('household_id', household.id),
    SB.from('items').select('*').eq('household_id', household.id).eq('status', 'active'),
    SB.from('foods').select('*').eq('household_id', household.id).order('name')
  ]);
  for (const r of [m, i, f]) if (r.error) throw r.error;
  members = m.data; items = i.data; foods = f.data;
  $('food-names').innerHTML = foods.map(x => `<option value="${esc(x.name)}">`).join('');
  render();
}
function subscribe(){
  if (channel) SB.removeChannel(channel);
  // 相手の追加・変更をすぐ反映する。
  channel = SB.channel('household-' + household.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'items', filter:`household_id=eq.${household.id}` }, () => {
      loadAll().catch(console.error);
    })
    .subscribe();
}
async function enterApp(){
  await loadHousehold();
  if (!household){ show('setup'); return; }
  await loadAll();
  subscribe();
  show(currentView);
}

/* ---------- 認証・家庭 ---------- */
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('login-error', null);
  const { error } = await SB.auth.signInWithPassword({ email:$('login-email').value.trim(), password:$('login-password').value });
  if (error) showError('login-error', error);
});
$('logout').addEventListener('click', () => SB.auth.signOut());

$('create-form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('setup-error', null);
  const { error } = await SB.rpc('create_household', { p_name:$('create-name').value, p_display_name:$('create-me').value });
  if (error) return showError('setup-error', error);
  enterApp().catch(err => showError('setup-error', err));
});
$('join-form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('setup-error', null);
  const { error } = await SB.rpc('join_household', { p_invite_code:$('join-code').value, p_display_name:$('join-me').value });
  if (error) return showError('setup-error', error.message.includes('invite code') ? '招待コードが見つかりません' : error);
  enterApp().catch(err => showError('setup-error', err));
});

SB.auth.onAuthStateChange((event, session) => {
  const next = session?.user || null;
  if (next?.id === user?.id && event !== 'INITIAL_SESSION') return;
  user = next;
  if (!user){
    household = null; items = []; foods = []; members = [];
    if (channel){ SB.removeChannel(channel); channel = null; }
    show('login');
    return;
  }
  // コールバック内で await すると supabase-js がデッドロックするため、外に出す。
  setTimeout(() => enterApp().catch(err => { console.error(err); show('login'); showError('login-error', err); }), 0);
});

/* ---------- タブ ---------- */
for (const b of document.querySelectorAll('nav.tabs button')){
  b.addEventListener('click', () => show(b.dataset.view));
}

/* ---------- 追加 ---------- */
const add = { zone:'fresh', location:'fridge', color:'other' };
function setSeg(container, value){
  for (const b of $(container).querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === value));
}
function renderAddForm(){
  setSeg('add-zone', add.zone);
  $('add-location').innerHTML = ZONE_LOCATIONS[add.zone]
    .map(loc => `<button type="button" data-v="${loc}" aria-pressed="${loc === add.location}">${LOCATION_LABEL[loc]}</button>`).join('');
  setSeg('add-color', add.color);
  $('category-names').innerHTML = Object.keys(CATEGORY_DEFAULTS[add.zone]).map(c => `<option value="${esc(c)}">`).join('');
  $('add-days-wrap').hidden = add.zone !== 'fresh';
}
function suggestedDays(){
  if (add.location === 'freezer') return FREEZER_DAYS;
  return CATEGORY_DEFAULTS.fresh[$('add-category').value.trim()]?.[1] ?? 7;
}
function findFood(name){
  const n = name.trim();
  return foods.find(f => f.name === n || f.aliases.includes(n)) || null;
}

$('fab').addEventListener('click', () => {
  $('add-form').reset();
  Object.assign(add, currentView === 'pantry'
    ? { zone:'pantry', location:'pantry', color:'other' }
    : { zone:'fresh', location:'fridge', color:'other' });
  showError('add-error', null);
  renderAddForm();
  $('add-dialog').showModal();
  $('add-name').focus();
});
$('add-cancel').addEventListener('click', () => $('add-dialog').close());

$('add-zone').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  add.zone = b.dataset.v;
  add.location = ZONE_LOCATIONS[add.zone][0];
  renderAddForm();
});
$('add-location').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  add.location = b.dataset.v;
  setSeg('add-location', add.location);
  if (add.zone === 'fresh') $('add-days').value = suggestedDays();
});
$('add-color').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  add.color = b.dataset.v;
  setSeg('add-color', add.color);
});
$('add-category').addEventListener('change', () => {
  const d = CATEGORY_DEFAULTS[add.zone][$('add-category').value.trim()];
  if (!d) return;
  add.color = d[0];
  setSeg('add-color', add.color);
  if (add.zone === 'fresh') $('add-days').value = suggestedDays();
});
// 食材マスタにある名前なら、前回の設定で埋める。
$('add-name').addEventListener('change', () => {
  const f = findFood($('add-name').value);
  if (!f) return;
  Object.assign(add, { zone:f.zone, location:f.location, color:f.color });
  renderAddForm();
  $('add-category').value = f.category;
  if (f.zone === 'fresh') $('add-days').value = f.location === 'freezer' ? FREEZER_DAYS : (f.default_days || suggestedDays());
});

$('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('add-error', null);
  const name = $('add-name').value.trim();
  if (!name) return;
  const category = $('add-category').value.trim();
  const days = add.zone === 'fresh' ? (parseInt($('add-days').value, 10) || suggestedDays()) : null;
  $('add-submit').disabled = true;
  try {
    // 食材マスタを最新の設定で更新する（冷凍の日数はマスタに残さない）。
    const master = { household_id:household.id, name:findFood(name)?.name || name, color:add.color, category,
      zone:add.zone, location:add.location };
    if (add.zone === 'fresh' && add.location !== 'freezer') master.default_days = days;
    const { data:food, error:foodError } = await SB.from('foods')
      .upsert(master, { onConflict:'household_id,name' }).select().single();
    if (foodError) throw foodError;
    const { error } = await SB.from('items').insert({
      household_id:household.id, food_id:food.id, name, color:add.color, category,
      zone:add.zone, location:add.location, quantity:$('add-quantity').value.trim(),
      added_at:todayStr(), use_by:days ? addDays(todayStr(), days) : null, source:'manual'
    });
    if (error) throw error;
    $('add-dialog').close();
    await loadAll();
  } catch (err){
    showError('add-error', err);
  } finally {
    $('add-submit').disabled = false;
  }
});

/* ---------- 食材の操作 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button.item'); if (!b) return;
  openItem = items.find(i => i.id === b.dataset.id); if (!openItem) return;
  $('item-title').textContent = openItem.name;
  const who = members.find(m => m.user_id === openItem.added_by)?.display_name;
  $('item-meta').textContent = [
    openItem.zone === 'fresh' ? LOCATION_LABEL[openItem.location] : 'ストック',
    COLOR_LABEL[openItem.color], openItem.category, openItem.quantity,
    `${openItem.added_at.replaceAll('-', '/')}に${who ? who + 'が' : ''}登録`
  ].filter(Boolean).join('・');
  $('item-days-wrap').hidden = openItem.zone !== 'fresh';
  $('item-days').value = openItem.use_by || '';
  showError('item-error', null);
  $('item-dialog').showModal();
});
$('item-close').addEventListener('click', () => $('item-dialog').close());

async function updateItem(patch){
  showError('item-error', null);
  const { error } = await SB.from('items').update(patch).eq('id', openItem.id);
  if (error) return showError('item-error', error);
  $('item-dialog').close();
  await loadAll();
}
const finish = status => updateItem({ status, finished_at:new Date().toISOString(), finished_by:user.id });
$('item-used').addEventListener('click', () => finish('used'));
$('item-discarded').addEventListener('click', () => finish('discarded'));
$('item-days').addEventListener('change', () => {
  if ($('item-days').value) updateItem({ use_by:$('item-days').value });
});
$('item-delete').addEventListener('click', async () => {
  if (!confirm(`「${openItem.name}」の記録を削除しますか？`)) return;
  const { error } = await SB.from('items').delete().eq('id', openItem.id);
  if (error) return showError('item-error', error);
  $('item-dialog').close();
  await loadAll();
});
</script>
